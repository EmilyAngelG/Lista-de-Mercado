<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lista de Mercado - Mobile/Tablet</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app">
    <header class="app-header">
      <h1>Lista de Mercado</h1>
      <p class="subtitle">Touch-first • Comparar listas • Sem backend</p>
    </header>

    <section id="list" class="list">
      <!-- Cards injected by JS -->
    </section>

    <!-- Floating add button at end of list (appears after last item) -->
    <div id="end-add" class="end-add">+</div>

    <!-- Bottom fixed bar -->
    <footer class="bottom-bar">
      <button id="footer-add" class="circle-add">+</button>
      <div class="compare-value" id="compareValue" tabindex="0"></div>
      <div class="total-value" id="totalValue" tabindex="0"></div>
    </footer>

    <!-- Modal: Save comparison -->
    <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-content">
        <button class="modal-close" id="modalClose">✕</button>
        <h2 id="modalTitle">Salvar para comparação</h2>
        <p>Valor atual da lista: <strong id="modalTotal"></strong></p>
        <div class="modal-actions">
          <button id="saveCompare" class="btn primary">Salvar para comparação</button>
          <button id="cancelModal" class="btn">Fechar</button>
        </div>
      </div>
    </div>

    <!-- Modal: Compare actions (delete) -->
    <div id="modalCompareActions" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-content small">
        <button class="modal-close" id="modalCompareClose">✕</button>
        <h3>Comparação ativa</h3>
        <p>Valor salvo: <strong id="compareSaved"></strong></p>
        <div class="modal-actions">
          <button id="deleteCompare" class="btn danger">Deletar comparação</button>
          <button id="closeCompareModal" class="btn">Fechar</button>
        </div>
      </div>
    </div>

  </main>

  <script src="app.js"></script>
</body>
</html>
